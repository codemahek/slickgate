# Benchmark configuration for HAProxy: single catch-all frontend to the shared
# backend, everything tuned for a small-request HTTP reverse-proxy workload.

global
    log stdout format raw local0 info
    maxconn 65536

defaults
    mode http
    log global
    option http-keep-alive
    option forwardfor
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    timeout http-keep-alive 30s

frontend fe_http
    bind *:80
    default_backend be_app

backend be_app
    option http-keep-alive
    option forwardfor
    server app bench-backend:8088 maxconn 0
