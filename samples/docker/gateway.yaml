# Container-oriented Slickgate config.
#
# Listens on 80/443 inside the container (map with -p 8080:80 -p 8443:443).
# Routes live in this file only; edits apply via the admin API
# (POST /-/reload or the admin UI's Save & Apply).

server:
  http_port: 80
  https_port: 443
  redirect_http_to_https: false

admin:
  enabled: true
  token: change-me
  # The admin UI is served separately (docker-compose service `admin` on
  # http://localhost:8081) and calls this admin API cross-origin.
  cors_origins:
    - http://localhost:8081
    - https://localhost:8081

acme:
  enabled: false
  email: admin@example.com
  directory_url: https://acme-staging-v02.api.letsencrypt.org/directory
  storage_dir: /data/certs

routes:
  - id: app
    host: app.localhost
    path_prefix: /
    upstreams:
      - http://app:80
    tls: internal

  - id: whoami
    host: whoami.localhost
    path_prefix: /
    upstreams:
      - http://whoami:80
    tls: internal
    health_check:
      path: /
