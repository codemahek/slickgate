# Container-oriented Slickgate config.
#
# Listens on 80/443 inside the container (map with -p 8080:80 -p 8443:443).
# Docker service discovery is enabled so containers on the shared network can
# register themselves with `slickgate.*` labels.

server:
  http_port: 80
  https_port: 443
  redirect_http_to_https: false

admin:
  enabled: true
  token: change-me
  # The admin UI is served separately (docker-compose service `admin` on
  # http://localhost:8081) and calls this admin API cross-origin.
  cors_origins:
    - http://localhost:8081
    - https://localhost:8081

acme:
  enabled: false
  email: admin@example.com
  directory_url: https://acme-staging-v02.api.letsencrypt.org/directory
  storage_dir: /data/certs

docker:
  enabled: true
  endpoint: unix:///var/run/docker.sock
  network: slickgate
  label_prefix: slickgate
  poll_interval: 10s

routes:
  - id: app
    host: app.localhost
    path_prefix: /
    upstreams:
      - http://app:80
    tls: internal
