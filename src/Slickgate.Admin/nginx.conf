# Slickgate admin UI - static Blazor WebAssembly host.
#
# This file is included from the image's http {} block, so it defines server
# blocks only (never http/gzip/mime directives).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Serve the precompressed .gz sidecars produced by `dotnet publish`
    # (CompressionEnabled). .br files are deleted in the Dockerfile because the
    # official nginx image ships no brotli module, so they can never be served.
    gzip_static on;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Fingerprinted framework assets are content-addressed, so they never change
    # under a given URL: cache them for a year.
    #   - `^~` stops the asset regex below from shadowing this block.
    #   - add_header does not merge across configuration levels, so once this
    #     block sets a header the server-level ones are dropped and must repeat.
    location ^~ /_framework/ {
        try_files $uri =404;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Package static content (_content/MudBlazor/...). Not fingerprinted, but only
    # changes when a dependency is upgraded, so a week of caching is safe.
    location ^~ /_content/ {
        try_files $uri =404;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # The app shell must be revalidated so a new deployment is picked up at once.
    location = /index.html {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "no-cache" always;
    }

    # Runtime settings (the gateway URL/token override) must never be cached.
    location = /appsettings.json {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "no-cache" always;
    }

    # A missing asset is a 404. Without this, `try_files` would answer with the
    # HTML shell and a 200, which surfaces as a confusing MIME/parse error.
    location ~* \.(?:js|mjs|css|wasm|map|json|png|jpe?g|gif|svg|ico|woff2?|ttf|eot)$ {
        try_files $uri =404;
    }

    # Everything else is client-side routing: serve the shell and let the router
    # resolve the path.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
