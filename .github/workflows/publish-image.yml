# Builds the portal image and pushes it to GitHub Container Registry.
#
# GHCR packages are private by default, so nothing is published publicly unless the package
# visibility is deliberately changed in the repository settings.
#
# The image contains no secrets: the owner password, database connection string and photo
# storage path are all supplied as environment variables when the container runs. Only the
# compiled application is baked in, which is why .dockerignore excludes *.db and uploads/.

name: Publish image

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      # Required for pushing to GHCR. Scoped to this repository only.
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Required before build-push-action: the default "docker" driver cannot export a gha
      # cache ("Cache export is not supported for the docker driver"). This creates a
      # docker-container builder, which supports type=gha both ways.
      - uses: docker/setup-buildx-action@v3

      - name: Derive image tag
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
