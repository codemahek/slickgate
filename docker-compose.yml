# Slickgate demo stack.
#
#   docker compose up --build
#
# Then browse:
#   http://app.localhost:8080     -> static route from /etc/slickgate/gateway.yaml
#   http://whoami.localhost:8080  -> static route from /etc/slickgate/gateway.yaml
#   http://localhost:8081         -> standalone admin UI (Blazor WebAssembly)
#
# (add app.localhost / whoami.localhost to your hosts file, or use
#  curl --resolve app.localhost:8080:127.0.0.1 ... on Windows/macOS where
#  *.localhost usually resolves automatically.)

services:
  gateway:
    build:
      context: .
      target: final
    image: slickgate:dev
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - slickgate-data:/data
    networks:
      - slickgate
    restart: unless-stopped

  # Standalone admin UI. Talks to the gateway exclusively over its admin HTTP
  # API (CORS origin below must include http://localhost:8081).
  admin:
    build:
      context: .
      dockerfile: src/Slickgate.Admin/Dockerfile
    image: slickgate-admin:dev
    ports:
      - "8081:80"
    networks:
      - slickgate
    depends_on:
      - gateway
    restart: unless-stopped

  # Statically configured upstream (referenced by the bundled gateway.yaml).
  app:
    image: traefik/whoami:latest
    networks:
      - slickgate
    restart: unless-stopped

  # Second statically configured upstream (referenced by the bundled gateway.yaml).
  whoami:
    image: traefik/whoami:latest
    networks:
      - slickgate
    restart: unless-stopped

networks:
  slickgate:
    name: slickgate

volumes:
  slickgate-data:
